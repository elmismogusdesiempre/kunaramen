<!DOCTYPE html>
<html lang="es" data-theme="cafe">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F4EDE4" />
<title>75° W — Experiencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     BASE
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --font-sans: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-serif: "Open Sans", Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    --font-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    --radius-card: 14px;
    --radius-bubble: 26px;
    --radius-btn: 12px;
    --radius-pill: 999px;
    --pad-x: 22px;
    --topbar-h: 58px;
    --font-scale: 1;
    --puzzle-size: 4;
  }

  /* ---- TEMAS ---- */
  [data-theme="cafe"] {
    --bg: #F4EDE4; --bg-2: #EBE1D3; --surface: #FFFBF5;
    --text: #2B2118; --muted: #8A7A68; --accent: #A66A3C;
    --accent-soft: #F0DFCB; --accent-contrast: #FFFFFF;
    --border: #E6D8C7; --shadow: 0 1px 2px rgba(43,33,24,.05);
  }
  [data-theme="rosa"] {
    --bg: #F7EDEE; --bg-2: #F1E2E4; --surface: #FFF9FA;
    --text: #3A2529; --muted: #8E7176; --accent: #B87A87;
    --accent-soft: #F2DEE2; --accent-contrast: #FFFFFF;
    --border: #EBD7DB; --shadow: 0 1px 2px rgba(58,37,41,.05);
  }
  [data-theme="verde"] {
    --bg: #EDF2EC; --bg-2: #E3EAE1; --surface: #F9FCF8;
    --text: #22302A; --muted: #6E7F72; --accent: #5E7F68;
    --accent-soft: #DCE7DD; --accent-contrast: #FFFFFF;
    --border: #D8E3D7; --shadow: 0 1px 2px rgba(34,48,42,.05);
  }
  [data-theme="azul"] {
    --bg: #EBF0F4; --bg-2: #E0E8EE; --surface: #F8FBFD;
    --text: #1F2A33; --muted: #6D7B86; --accent: #587C96;
    --accent-soft: #DAE5ED; --accent-contrast: #FFFFFF;
    --border: #D5E0E8; --shadow: 0 1px 2px rgba(31,42,51,.05);
  }
  [data-theme="crema"] {
    --bg: #FBF5E9; --bg-2: #F4EBD8; --surface: #FFFDF7;
    --text: #322A1D; --muted: #8A7A5C; --accent: #B89355;
    --accent-soft: #F1E6CB; --accent-contrast: #FFFFFF;
    --border: #EDE1C9; --shadow: 0 1px 2px rgba(50,42,29,.05);
  }
  [data-theme="oscuro"] {
    --bg: #17130F; --bg-2: #201B16; --surface: #241F1A;
    --text: #F2EBE1; --muted: #9C8F80; --accent: #D89B6A;
    --accent-soft: #362C22; --accent-contrast: #1A1512;
    --border: #342C24; --shadow: 0 1px 2px rgba(0,0,0,.3);
  }

  html[data-fs="small"] { --font-scale: 0.92; }
  html[data-fs="normal"] { --font-scale: 1; }
  html[data-fs="large"] { --font-scale: 1.12; }
  html[data-fs="xl"] { --font-scale: 1.24; }

  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    transition: background .4s ease, color .4s ease;
    line-height: 1.55;
    font-size: calc(16px * var(--font-scale));
    font-weight: 400;
  }
  button { font-family: inherit; color: inherit; font-size: inherit; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  img { max-width: 100%; display: block; }

  /* ============================================================
     TOPBAR
     ============================================================ */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: calc(var(--topbar-h) + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    display: flex; align-items: center; justify-content: space-between;
    padding-left: 20px; padding-right: 12px;
    background: var(--bg); z-index: 50;
    transition: background .4s ease;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-height: 32px; }
  .brand img { height: 28px; width: auto; }
  .brand-text {
    font-family: var(--font-serif);
    font-size: calc(19px * var(--font-scale));
    letter-spacing: .12em; font-weight: 700;
    color: var(--text); white-space: nowrap;
  }
  .brand-text .deg { color: var(--accent); }

  .icon-btn {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    background: transparent; border: none; border-radius: 50%;
    color: var(--muted); cursor: pointer;
    transition: color .2s ease, background .2s ease, transform .15s ease;
  }
  .icon-btn:hover { color: var(--text); background: var(--accent-soft); }
  .icon-btn:active { transform: scale(.94); }

  /* ============================================================
     LAYOUT
     ============================================================ */
  main {
    max-width: 540px; margin: 0 auto;
    padding: calc(var(--topbar-h) + env(safe-area-inset-top) + 20px) var(--pad-x) calc(24px + env(safe-area-inset-bottom));
    min-height: 100dvh;
  }
  .view-in { animation: viewIn .42s cubic-bezier(.22,.8,.32,1) both; }
  @keyframes viewIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  .exp { display: flex; flex-direction: column; }

  .eyebrow {
    font-size: calc(12px * var(--font-scale));
    letter-spacing: .2em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 10px; font-weight: 600;
  }
  .exp-title {
    font-family: var(--font-serif);
    font-size: calc(clamp(26px, 7.4vw, 38px) * var(--font-scale));
    line-height: 1.15; letter-spacing: -.01em; font-weight: 700;
    margin: 0 0 8px;
  }
  .exp-sub {
    font-size: calc(15.5px * var(--font-scale));
    color: var(--muted); margin: 0 0 18px; max-width: 34ch;
    line-height: 1.5;
  }

  /* ============================================================
     PREGUNTAS — BURBUJAS
     ============================================================ */
  .q-progress {
    display: flex; gap: 7px; align-items: center;
    margin: 4px 0 26px; padding-left: 2px;
  }
  .q-progress .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border);
    transition: width .35s cubic-bezier(.3,1.2,.4,1),
                background .3s ease, opacity .3s ease,
                border-radius .35s ease;
  }
  .q-progress .dot.done { background: var(--accent); opacity: .45; }
  .q-progress .dot.active {
    width: 30px; border-radius: 6px;
    background: var(--accent); opacity: 1;
  }

  .q-block { transition: opacity .22s ease, transform .22s ease; }
  .q-block.q-out { opacity: 0; transform: translateX(-8px); }

  .q-bubble {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-bubble);
    padding: 36px 22px 24px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    animation: bubbleIn .48s cubic-bezier(.22,.8,.32,1) both;
  }
  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(14px) scale(.965); }
    to   { opacity: 1; transform: none; }
  }

  .q-emoji-badge {
    position: absolute;
    top: -26px; left: 50%;
    transform: translateX(-50%);
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--accent-soft);
    display: grid; place-items: center;
    font-family: var(--font-emoji);
    font-size: 24px; line-height: 1;
    border: 3px solid var(--surface);
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
    animation: badgeFloat 3.6s ease-in-out infinite;
  }
  @keyframes badgeFloat {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-3px); }
  }

  .q-count {
    font-size: calc(11.5px * var(--font-scale));
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 8px; font-weight: 600;
  }
  .q-text {
    font-family: var(--font-serif);
    font-size: calc(clamp(20px, 5.2vw, 26px) * var(--font-scale));
    line-height: 1.28; font-weight: 700;
    margin: 0; letter-spacing: -.005em;
    text-wrap: balance;
  }

  .options { display: flex; flex-direction: column; gap: 9px; }

  .option {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    padding: 10px 16px 10px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    font-size: calc(15.5px * var(--font-scale));
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: border-color .18s ease, background .18s ease,
                transform .1s ease, box-shadow .18s ease;
    box-shadow: var(--shadow);
    -webkit-tap-highlight-color: transparent;
    animation: optIn .42s cubic-bezier(.22,.8,.32,1) both;
  }
  @keyframes optIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  .option .opt-emoji {
    width: 38px; height: 38px; flex: 0 0 auto;
    border-radius: 12px;
    background: var(--accent-soft);
    display: grid; place-items: center;
    font-family: var(--font-emoji);
    font-size: 18px; line-height: 1;
    transition: transform .2s ease, background .2s ease;
  }
  .option .opt-label { flex: 1; }
  .option::after {
    content: "";
    width: 6px; height: 6px;
    border-right: 1.8px solid var(--muted);
    border-top: 1.8px solid var(--muted);
    transform: rotate(45deg);
    opacity: .4; flex: 0 0 auto; margin-right: 4px;
    transition: transform .2s ease, opacity .2s ease, border-color .2s ease;
  }
  .option:hover { border-color: var(--accent); }
  .option:hover .opt-emoji { transform: scale(1.08) rotate(-4deg); }
  .option:hover::after { border-color: var(--accent); opacity: .9; transform: rotate(45deg) translate(1px,-1px); }
  .option:active { transform: scale(.985); background: var(--accent-soft); }
  .option:active .opt-emoji { background: var(--surface); }

  /* ============================================================
     RESULTADO PERFIL
     ============================================================ */
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 24px 22px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
    animation: viewIn .5s cubic-bezier(.22,.8,.32,1) both;
  }
  .result-kicker {
    font-size: calc(11.5px * var(--font-scale));
    letter-spacing: .2em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 12px; font-weight: 700;
  }
  .result-name {
    font-family: var(--font-serif);
    font-size: calc(clamp(24px, 6.8vw, 34px) * var(--font-scale));
    line-height: 1.15; font-weight: 700;
    margin: 0 0 12px; letter-spacing: -.01em;
  }
  .result-desc {
    font-size: calc(15.5px * var(--font-scale));
    color: var(--text); opacity: .85;
    margin: 0 0 18px; line-height: 1.6;
  }
  .result-quote {
    font-family: var(--font-serif); font-style: italic;
    font-size: calc(17px * var(--font-scale));
    line-height: 1.5; color: var(--accent);
    margin: 0; padding-top: 16px; border-top: 1px solid var(--border);
    font-weight: 500;
  }

  /* ============================================================
     TARJETA DE MOMENTO
     ============================================================ */
  .moment-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 24px 22px 22px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
    text-align: left;
    animation: viewIn .5s cubic-bezier(.22,.8,.32,1) both;
    position: relative; overflow: hidden;
  }
  .moment-card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--accent);
  }
  .moment-mark {
    font-family: var(--font-serif); font-size: calc(11.5px * var(--font-scale));
    letter-spacing: .26em; color: var(--muted);
    margin: 0 0 14px; text-transform: uppercase; font-weight: 600;
  }
  .moment-time {
    font-family: var(--font-serif);
    font-size: calc(clamp(24px, 6.8vw, 36px) * var(--font-scale));
    line-height: 1.15; font-weight: 700;
    margin: 0 0 6px; letter-spacing: -.01em;
  }
  .moment-time .dot-sep { color: var(--accent); padding: 0 6px; }
  .moment-with { font-size: calc(16px * var(--font-scale)); color: var(--muted); margin: 0 0 18px; }
  .moment-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .tag {
    display: inline-block; padding: 7px 13px;
    border-radius: var(--radius-pill);
    background: var(--accent-soft); color: var(--text);
    font-size: calc(13.5px * var(--font-scale)); font-weight: 600; letter-spacing: .01em;
  }
  .moment-line {
    font-family: var(--font-serif); font-style: italic;
    font-size: calc(16.5px * var(--font-scale)); line-height: 1.5;
    color: var(--text); opacity: .9;
    margin: 0; padding-top: 18px; border-top: 1px solid var(--border);
  }
  .moment-personal { margin: 14px 0 0; font-size: calc(14px * var(--font-scale)); color: var(--muted); }

  /* ============================================================
     CIERRE COMÚN
     ============================================================ */
  .end-intro { text-align: left; margin-bottom: 18px; }
  .end-intro .eyebrow { margin-bottom: 8px; }
  .end-headline {
    font-family: var(--font-serif);
    font-size: calc(clamp(22px, 6.4vw, 30px) * var(--font-scale));
    line-height: 1.2; font-weight: 700;
    margin: 0 0 6px; letter-spacing: -.01em;
  }
  .end-sub { font-size: calc(15.5px * var(--font-scale)); color: var(--muted); margin: 0; }

  .end-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 20px 20px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .end-card-mark {
    font-family: var(--font-serif); font-size: calc(11.5px * var(--font-scale));
    letter-spacing: .28em; color: var(--accent);
    margin: 0 0 10px; text-transform: uppercase; font-weight: 700;
  }
  .end-card-title {
    font-family: var(--font-serif);
    font-size: calc(19px * var(--font-scale));
    line-height: 1.35; font-weight: 700; margin: 0 0 6px;
  }
  .end-card-line {
    font-size: calc(15.5px * var(--font-scale)); color: var(--muted);
    margin: 0; line-height: 1.55;
  }

  .end-actions { display: flex; flex-direction: column; gap: 10px; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 16px 20px;
    border-radius: var(--radius-btn);
    font-size: calc(16px * var(--font-scale));
    font-weight: 600; letter-spacing: .005em;
    border: 1px solid transparent; cursor: pointer;
    text-decoration: none;
    transition: transform .12s ease, background .2s ease, border-color .2s ease, opacity .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(.985); }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); }
  .btn-primary:hover { opacity: .92; }
  .btn-ghost { background: transparent; border-color: var(--border); color: var(--text); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm { padding: 12px 14px; font-size: calc(14px * var(--font-scale)); font-weight: 600; }

  .btn-primary .ig-logo {
    width: calc(20px * var(--font-scale));
    height: calc(20px * var(--font-scale));
    flex: 0 0 auto;
    display: block;
    color: currentColor;
  }

  .end-fine {
    margin: 14px 0 0; font-size: calc(12.5px * var(--font-scale));
    color: var(--muted); text-align: center; opacity: .85;
  }

  /* ============================================================
     JUEGO — ATRAPA EL CAFÉ
     ============================================================ */
  .game-hud {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 10px; padding: 0 2px;
  }
  .hud-score {
    font-family: var(--font-serif); font-size: calc(26px * var(--font-scale));
    font-weight: 700; letter-spacing: .02em;
    display: flex; align-items: baseline; gap: 8px;
  }
  .hud-score .hud-ico { font-size: calc(18px * var(--font-scale)); opacity: .8; font-family: var(--font-emoji); }
  .hud-time {
    font-size: calc(13.5px * var(--font-scale)); color: var(--muted);
    letter-spacing: .1em; text-transform: uppercase;
    font-variant-numeric: tabular-nums; font-weight: 600;
  }

  .game-stage {
    position: relative; width: 100%;
    height: min(
      calc(100dvh - var(--topbar-h) - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 190px),
      480px
    );
    min-height: 260px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    overflow: hidden; box-shadow: var(--shadow);
    touch-action: none; cursor: grab;
  }
  .game-stage:active { cursor: grabbing; }
  #game-canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .game-note {
    margin: 12px 0 0; min-height: 20px;
    font-size: calc(14.5px * var(--font-scale)); color: var(--muted);
    text-align: center; transition: opacity .3s ease;
    font-style: italic; font-family: var(--font-serif);
  }

  /* ============================================================
     JUEGO — BARISTA POR 1 MINUTO
     ============================================================ */
  .barista-hud {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 10px; padding: 0 2px; gap: 12px;
  }
  .barista-count {
    font-family: var(--font-serif); font-size: calc(15px * var(--font-scale));
    color: var(--muted); letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
  }
  .barista-count strong {
    color: var(--text); font-weight: 700;
    font-size: calc(17px * var(--font-scale)); letter-spacing: .04em;
  }
  .barista-time {
    font-size: calc(13px * var(--font-scale)); color: var(--muted);
    letter-spacing: .16em; text-transform: uppercase;
    font-variant-numeric: tabular-nums; font-weight: 600;
  }
  .barista-timerbar {
    width: 100%; height: 3px;
    background: var(--border);
    border-radius: 3px; overflow: hidden;
    margin-bottom: 14px;
  }
  .barista-timerbar > span {
    display: block; height: 100%;
    width: 100%; background: var(--accent);
    border-radius: 3px;
    transition: width .25s linear, background .3s ease;
  }
  .barista-timerbar.warn > span { background: #C77C4A; }

  .barista-order-bubble {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-bubble);
    padding: 32px 20px 20px;
    text-align: center;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    animation: bubbleIn .48s cubic-bezier(.22,.8,.32,1) both;
  }
  .barista-order-bubble .q-emoji-badge { font-size: 22px; width: 46px; height: 46px; top: -23px; }
  .barista-order-label {
    font-size: calc(11.5px * var(--font-scale)); letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 6px; font-weight: 600;
  }
  .barista-order-name {
    font-family: var(--font-serif);
    font-size: calc(clamp(22px, 6.4vw, 30px) * var(--font-scale));
    line-height: 1.2; font-weight: 700;
    margin: 0; letter-spacing: -.01em;
  }

  .barista-help-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 10px 14px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    transition: border-color .2s ease, background .2s ease;
  }
  .barista-help-row.on { border-color: var(--accent); }
  .barista-help-text {
    display: flex; flex-direction: column; gap: 2px;
    min-width: 0;
  }
  .barista-help-title {
    font-size: calc(14.5px * var(--font-scale)); font-weight: 700; color: var(--text);
    display: flex; align-items: center; gap: 7px;
  }
  .barista-help-title .hico { font-family: var(--font-emoji); font-size: calc(16px * var(--font-scale)); }
  .barista-help-sub {
    font-size: calc(12.5px * var(--font-scale)); color: var(--muted); line-height: 1.4;
  }
  .barista-help-row .switch {
    flex: 0 0 auto;
    width: 46px; height: 28px;
  }
  .barista-help-row .switch span {
    width: 22px; height: 22px;
  }
  .barista-help-row .switch.on span { transform: translateX(18px); }

  .barista-cup {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 16px 16px 18px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .barista-cup-label {
    font-size: calc(11.5px * var(--font-scale)); letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 10px; font-weight: 700;
    text-align: center;
  }
  .barista-cup-row {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; align-items: center;
    min-height: 54px;
  }
  .barista-cup-row .slot {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--accent-soft);
    font-family: var(--font-emoji);
    font-size: 20px; line-height: 1;
    animation: slotPop .32s cubic-bezier(.2,1.4,.4,1) both;
  }
  .barista-cup-row .slot.slot-base { opacity: .55; }
  @keyframes slotPop {
    from { opacity: 0; transform: scale(.5); }
    to   { opacity: 1; transform: scale(1); }
  }
  .barista-cup-empty {
    font-family: var(--font-serif); font-style: italic;
    font-size: calc(15px * var(--font-scale)); color: var(--muted);
    text-align: center;
  }
  .barista-cup-hint {
    margin: 10px 0 0;
    text-align: center;
    font-size: calc(13.5px * var(--font-scale));
    color: var(--muted);
    font-style: italic;
    font-family: var(--font-serif);
    min-height: 1.2em;
  }
  .barista-cup-hint strong { color: var(--accent); font-style: normal; font-weight: 700; }

  .barista-controls {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .barista-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    font-size: calc(15px * var(--font-scale)); font-weight: 600;
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .1s ease, border-color .18s ease, background .18s ease, opacity .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .barista-btn .bico {
    width: 34px; height: 34px; flex: 0 0 auto;
    border-radius: 10px;
    background: var(--accent-soft);
    display: grid; place-items: center;
    font-family: var(--font-emoji);
    font-size: 17px; line-height: 1;
    transition: transform .18s ease;
  }
  .barista-btn:hover { border-color: var(--accent); }
  .barista-btn:hover .bico { transform: scale(1.08) rotate(-4deg); }
  .barista-btn:active { transform: scale(.97); background: var(--accent-soft); }
  .barista-btn.dimmed { opacity: .35; pointer-events: none; }
  .barista-btn.complete { border-color: var(--accent); background: var(--accent-soft); }

  .barista-serve {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 16px 20px;
    background: var(--accent);
    color: var(--accent-contrast);
    border: none; border-radius: var(--radius-btn);
    font-size: calc(16px * var(--font-scale)); font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    cursor: pointer;
    transition: transform .12s ease, opacity .2s ease;
    -webkit-tap-highlight-color: transparent;
    box-shadow: var(--shadow);
  }
  .barista-serve:active { transform: scale(.985); }
  .barista-serve:hover { opacity: .92; }

  .barista-pop {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 26px;
    background: rgba(20,14,10,.28);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    z-index: 120;
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .barista-pop.show { opacity: 1; pointer-events: auto; }

  .barista-pop-card {
    background: #FFFFFF; color: #1F1813;
    border-radius: 20px;
    padding: 36px 26px 32px;
    max-width: 420px; width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.08);
    transform: translateY(14px) scale(.96);
    transition: transform .32s cubic-bezier(.22,.9,.32,1.15);
  }
  .barista-pop.show .barista-pop-card { transform: none; }
  .barista-pop-ico {
    font-family: var(--font-emoji);
    font-size: calc(50px * var(--font-scale));
    line-height: 1; margin-bottom: 14px; display: block;
  }
  .barista-pop-title {
    font-family: var(--font-sans);
    font-size: calc(clamp(24px, 6.8vw, 32px) * var(--font-scale));
    line-height: 1.2; font-weight: 800;
    letter-spacing: -.015em;
    margin: 0 0 8px; color: #1F1813;
  }
  .barista-pop-title.ok { color: #7A4A22; }
  .barista-pop-title.bad { color: #B15C3C; }
  .barista-pop-sub {
    font-family: var(--font-sans);
    font-size: calc(15.5px * var(--font-scale));
    line-height: 1.5; color: #6B5B4D;
    margin: 0; font-weight: 500;
  }
  .barista-pop-card.summary {
    padding: 40px 26px 34px; max-width: 440px;
  }
  .barista-pop-card.summary .barista-pop-ico {
    font-size: calc(64px * var(--font-scale)); margin-bottom: 18px;
  }
  .barista-pop-card.summary .barista-pop-title {
    font-size: calc(clamp(26px, 7.4vw, 36px) * var(--font-scale));
    margin-bottom: 6px;
  }
  .barista-pop-card.summary .barista-pop-sub {
    font-size: calc(16px * var(--font-scale)); margin-bottom: 22px;
  }
  .barista-pop-stats {
    display: flex; justify-content: center; gap: 22px;
    padding: 18px 12px;
    border-top: 1px solid #EFE7DC;
    border-bottom: 1px solid #EFE7DC;
    margin-bottom: 20px;
  }
  .barista-pop-stat {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px; min-width: 90px;
  }
  .barista-pop-stat-value {
    font-family: var(--font-sans);
    font-size: calc(clamp(30px, 8vw, 42px) * var(--font-scale));
    font-weight: 800; line-height: 1;
    letter-spacing: -.02em; color: #7A4A22;
    font-variant-numeric: tabular-nums;
  }
  .barista-pop-stat-label {
    font-family: var(--font-sans);
    font-size: calc(11.5px * var(--font-scale));
    font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; color: #9C8875;
  }
  .barista-pop-cta {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 13px 24px;
    background: #1F1813; color: #FFFFFF;
    border: none; border-radius: var(--radius-btn);
    font-family: var(--font-sans);
    font-size: calc(15px * var(--font-scale));
    font-weight: 700; letter-spacing: .04em;
    cursor: pointer;
    transition: transform .12s ease, opacity .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .barista-pop-cta:active { transform: scale(.97); }
  .barista-pop-cta:hover { opacity: .9; }

  /* ============================================================
     JUEGO — ROMPECABEZAS 15 (LOGO 75° W)
     ============================================================ */
  .puzzle-hud {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 10px; padding: 0 2px; gap: 12px;
  }
  .puzzle-moves {
    font-family: var(--font-serif); font-size: calc(15px * var(--font-scale));
    color: var(--muted); letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
  }
  .puzzle-moves strong {
    color: var(--text); font-weight: 700;
    font-size: calc(17px * var(--font-scale)); letter-spacing: .04em;
  }
  .puzzle-time {
    font-size: calc(13px * var(--font-scale)); color: var(--muted);
    letter-spacing: .16em; text-transform: uppercase;
    font-variant-numeric: tabular-nums; font-weight: 600;
  }
  .puzzle-timerbar {
    width: 100%; height: 3px;
    background: var(--border);
    border-radius: 3px; overflow: hidden;
    margin-bottom: 12px;
  }
  .puzzle-timerbar > span {
    display: block; height: 100%;
    width: 100%; background: var(--accent);
    border-radius: 3px;
    transition: width .25s linear, background .3s ease;
  }
  .puzzle-timerbar.warn > span { background: #C77C4A; }

  /* Selector de dificultad del puzzle (3x3 o 4x4) */
  .puzzle-difficulty {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .puzzle-diff-label {
    font-size: calc(11px * var(--font-scale));
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
    flex: 0 0 auto;
  }
  .puzzle-difficulty .seg {
    flex: 1;
    padding: 3px;
    gap: 3px;
  }
  .puzzle-difficulty .seg button {
    padding: 8px 6px;
    font-size: calc(13.5px * var(--font-scale));
    border-radius: 8px;
  }

  .puzzle-preview {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 10px 12px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .puzzle-preview-img {
    width: 52px; height: 52px;
    border-radius: 10px;
    background: var(--accent-soft);
    overflow: hidden;
    flex: 0 0 auto;
    display: grid; place-items: center;
    font-family: var(--font-serif);
    color: var(--accent);
    font-weight: 700; font-size: 13px;
    letter-spacing: .08em;
  }
  .puzzle-preview-img img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .puzzle-preview-text {
    font-size: calc(12.5px * var(--font-scale));
    color: var(--muted); line-height: 1.4;
    min-width: 0;
  }
  .puzzle-preview-text strong { color: var(--text); font-weight: 700; }

  .puzzle-board {
    width: 100%;
    max-width: min(100%, calc(100dvh - var(--topbar-h) - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 340px));
    margin: 0 auto;
    aspect-ratio: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 6px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: repeat(var(--puzzle-size), 1fr);
    grid-template-rows: repeat(var(--puzzle-size), 1fr);
    gap: 5px;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  .puzzle-tile {
    position: relative;
    overflow: hidden;
    border-radius: 7px;
    background: var(--accent-soft);
    cursor: pointer;
    transition: transform .12s ease, background .2s ease, box-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .puzzle-tile:active { transform: scale(.96); }
  .puzzle-tile.empty {
    background: transparent;
    cursor: default;
    box-shadow: none;
    pointer-events: none;
  }
  .puzzle-tile:not(.empty)::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: 7px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
    pointer-events: none;
  }
  .puzzle-tile.movable {
    box-shadow: inset 0 0 0 2px var(--accent), 0 2px 6px rgba(0,0,0,.06);
  }
  .puzzle-tile.just-moved {
    animation: tilePop .22s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes tilePop {
    from { transform: scale(1.06); }
    to   { transform: scale(1); }
  }
  .puzzle-tile.solved {
    animation: tileSolved .6s ease both;
  }
  @keyframes tileSolved {
    0%   { box-shadow: inset 0 0 0 2px var(--accent); }
    100% { box-shadow: inset 0 0 0 2px var(--accent); opacity: 1; }
  }

  .puzzle-img-wrapper {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: inherit;
  }
  .puzzle-img-wrapper img {
    position: absolute;
    width: calc(100% * var(--puzzle-size));
    height: calc(100% * var(--puzzle-size));
    max-width: none;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    display: block;
  }

  .puzzle-fallback {
    position: absolute;
    inset: 0;
    display: grid; place-items: center;
    font-family: var(--font-serif);
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    font-size: calc(13px * var(--font-scale));
    letter-spacing: .1em;
  }

  .puzzle-actions {
    display: flex; gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .puzzle-actions .btn {
    flex: 1 1 130px;
    padding: 12px 14px;
    font-size: calc(13.5px * var(--font-scale));
  }
  .btn-mercy {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn-mercy:hover {
    background: var(--accent);
    color: var(--accent-contrast);
    border-color: var(--accent);
  }
  .btn-mercy .mercy-ico { font-family: var(--font-emoji); font-size: calc(15px * var(--font-scale)); }
  .btn-mercy.bumped { animation: mercyBump .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes mercyBump {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  /* ============================================================
     SPLASH
     ============================================================ */
  #splash {
    position: fixed; inset: 0;
    background: var(--bg); z-index: 200;
    display: flex; align-items: center; justify-content: center;
    padding: 32px; opacity: 0; pointer-events: none;
    transition: opacity .38s ease;
  }
  #splash.show { opacity: 1; pointer-events: auto; }

  .splash-inner { text-align: center; max-width: 340px; }
  .splash-logo {
    font-family: var(--font-serif); font-size: calc(16px * var(--font-scale));
    letter-spacing: .32em; color: var(--accent);
    margin-bottom: 26px; text-transform: uppercase; font-weight: 700;
  }
  .splash-text {
    font-family: var(--font-serif);
    font-size: calc(clamp(20px, 5.8vw, 26px) * var(--font-scale));
    line-height: 1.4; color: var(--text);
    margin: 0; min-height: 2.7em;
    transition: opacity .2s ease; font-weight: 600;
  }
  .splash-text.splash-name {
    font-size: calc(clamp(26px, 7.4vw, 34px) * var(--font-scale));
    font-weight: 700; letter-spacing: -.01em;
  }
  .splash-dots {
    margin-top: 30px; display: flex; justify-content: center; gap: 8px;
  }
  .splash-dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); opacity: .25;
    animation: dotPulse 1.2s infinite ease-in-out;
  }
  .splash-dots span:nth-child(2) { animation-delay: .15s; }
  .splash-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes dotPulse {
    0%, 80%, 100% { opacity: .2; transform: scale(.85); }
    40% { opacity: .9; transform: scale(1); }
  }

  /* ============================================================
     PANEL DE CONFIGURACIÓN
     ============================================================ */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(20,14,10,.4); z-index: 150;
    opacity: 0; pointer-events: none;
    transition: opacity .28s ease;
    display: flex; align-items: flex-end; justify-content: center;
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }

  .sheet {
    background: var(--surface); color: var(--text);
    width: 100%; max-width: 540px;
    border-radius: 20px 20px 0 0;
    padding: 12px 22px calc(28px + env(safe-area-inset-bottom));
    max-height: 88dvh; overflow-y: auto;
    transform: translateY(24px);
    transition: transform .34s cubic-bezier(.2,.8,.3,1), background .4s ease;
    box-shadow: 0 -8px 40px rgba(0,0,0,.14);
  }
  .sheet-backdrop.open .sheet { transform: translateY(0); }

  .sheet-handle {
    width: 40px; height: 4px; background: var(--border);
    border-radius: 4px; margin: 6px auto 16px;
  }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px;
  }
  .sheet-head h3 {
    font-family: var(--font-serif); font-size: calc(23px * var(--font-scale));
    font-weight: 700; margin: 0; letter-spacing: -.005em;
  }

  .setting-group { margin-bottom: 26px; }
  .setting-label {
    font-size: calc(12px * var(--font-scale));
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); font-weight: 700; margin: 0 0 12px;
  }

  .theme-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px;
  }
  .theme-swatch {
    aspect-ratio: 1; border-radius: 10px;
    border: 1.5px solid var(--border);
    cursor: pointer; position: relative;
    padding: 0; overflow: hidden;
    transition: transform .15s ease, border-color .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .theme-swatch:active { transform: scale(.93); }
  .theme-swatch.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }
  .theme-name {
    display: block; font-size: calc(11px * var(--font-scale)); color: var(--muted);
    text-align: center; margin-top: 6px; letter-spacing: .02em; font-weight: 600;
  }
  .theme-cell { display: flex; flex-direction: column; }

  .seg {
    display: flex; background: var(--bg-2);
    border-radius: var(--radius-btn); padding: 4px; gap: 4px;
  }
  .seg button {
    flex: 1; border: none; background: transparent;
    padding: 11px 8px; border-radius: 9px;
    font-size: calc(14.5px * var(--font-scale)); font-weight: 600; color: var(--muted);
    cursor: pointer;
    transition: background .2s ease, color .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .seg button.selected {
    background: var(--surface); color: var(--text);
    font-weight: 700; box-shadow: var(--shadow);
  }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--border); background: transparent;
    color: var(--text); padding: 10px 15px;
    border-radius: var(--radius-pill);
    font-size: calc(14.5px * var(--font-scale)); font-weight: 600; cursor: pointer;
    transition: all .18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .chip.selected {
    background: var(--accent); border-color: var(--accent);
    color: var(--accent-contrast);
  }
  .chip:active { transform: scale(.96); }

  .switch-row {
    display: flex; align-items: center; justify-content: space-between;
  }
  .switch-row .setting-label { margin: 0; }

  .switch {
    width: 50px; height: 30px; border-radius: var(--radius-pill);
    background: var(--border); border: none; position: relative;
    cursor: pointer; padding: 0;
    transition: background .22s ease;
    -webkit-tap-highlight-color: transparent;
    flex: 0 0 auto;
  }
  .switch span {
    position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--surface);
    transition: transform .22s cubic-bezier(.3,1.4,.5,1);
    box-shadow: 0 1px 3px rgba(0,0,0,.18);
  }
  .switch.on { background: var(--accent); }
  .switch.on span { transform: translateX(20px); }

  /* ============================================================
     TOAST
     ============================================================ */
  #toast {
    position: fixed; left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translate(-50%, 14px);
    background: var(--text); color: var(--bg);
    padding: 13px 20px; border-radius: var(--radius-pill);
    font-size: calc(15px * var(--font-scale)); font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease, transform .3s cubic-bezier(.2,.8,.3,1);
    z-index: 300; max-width: 90vw; text-align: center; line-height: 1.4;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ============================================================
     UTILIDADES
     ============================================================ */
  .mt-lg { margin-top: 28px; }
  .center { text-align: center; }

  @media (max-height: 700px) {
    :root { --topbar-h: 52px; }
    main {
      padding-top: calc(var(--topbar-h) + env(safe-area-inset-top) + 12px);
    }
    .exp-title { font-size: calc(clamp(22px, 6.4vw, 30px) * var(--font-scale)); }
    .exp-sub { margin-bottom: 12px; }
    .q-progress { margin-bottom: 18px; }
    .q-bubble { padding: 30px 18px 18px; margin-bottom: 14px; }
    .options { gap: 7px; }
    .option { padding: 8px 14px 8px 9px; font-size: calc(14.5px * var(--font-scale)); }
    .option .opt-emoji { width: 34px; height: 34px; font-size: 16px; }
    .game-stage {
      height: min(
        calc(100dvh - var(--topbar-h) - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 150px),
        420px
      );
      min-height: 220px;
    }
    .puzzle-board {
      max-width: min(100%, calc(100dvh - var(--topbar-h) - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 300px));
    }
    .barista-order-bubble { padding: 26px 16px 16px; margin-bottom: 10px; }
    .barista-cup { padding: 12px 12px 14px; margin-bottom: 10px; }
    .barista-help-row { padding: 8px 12px; margin-bottom: 10px; }
    .barista-controls { gap: 6px; margin-bottom: 8px; }
    .barista-btn { padding: 9px 12px; font-size: calc(14px * var(--font-scale)); }
    .barista-btn .bico { width: 30px; height: 30px; font-size: 15px; }
    .barista-serve { padding: 14px 18px; }
    .puzzle-actions { margin-top: 10px; }
  }

  @media (min-width: 640px) {
    main { padding-top: calc(var(--topbar-h) + 40px); }
    :root { --pad-x: 28px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;

<script>
/* ================================================================
   75° W — Experiencia interactiva
   ================================================================ */

/* ----------------------------------------------------------------
   CONFIGURACIÓN EDITABLE
   ---------------------------------------------------------------- */
const INSTAGRAM_URL    = "https://www.instagram.com/75gradosw/";
const LOGO_URL         = "";
const PUZZLE_IMAGE_URL = "https://raw.githubusercontent.com/elmismogusdesiempre/75gradosactivacion/main/cuadrado.jpg";
/* Tamaño por defecto del rompecabezas. Se puede cambiar a 3 desde el
   propio juego; el valor elegido se persiste en localStorage. */
const PUZZLE_GRID_SIZE = 4;
/* Segundos extra que otorga cada pulsación del botón "Piedad, más tiempo". */
const PUZZLE_MERCY_SECONDS = 60;

const INSTAGRAM_SVG = `
  <svg class="ig-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"
       aria-hidden="true" focusable="false">
    <rect x="3" y="3" width="18" height="18" rx="5" ry="5"/>
    <circle cx="12" cy="12" r="4"/>
    <circle cx="17.2" cy="6.8" r="1.05" fill="currentColor" stroke="none"/>
  </svg>
`;

/* Normaliza el tamaño del puzzle. Solo acepta 3 o 4. */
function normalizePuzzleSize(v) {
  const n = Number(v);
  return (n === 3 || n === 4) ? n : PUZZLE_GRID_SIZE;
}

/* ----------------------------------------------------------------
   ESTADO Y PREFERENCIAS
   ---------------------------------------------------------------- */
const DEFAULT_SETTINGS = {
  theme: "cafe",
  fontScale: "normal",
  speed: "normal",
  coffee: "",
  sound: false,
  baristaHelp: false,
  puzzleSize: 4
};

let settings = { ...DEFAULT_SETTINGS };
let currentExperience = null;
let cleanupFns = [];

/* ----------------------------------------------------------------
   PERSISTENCIA
   ---------------------------------------------------------------- */
function loadSettings() {
  try {
    const raw = localStorage.getItem("w75_settings");
    if (raw) settings = { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
    settings.puzzleSize = normalizePuzzleSize(settings.puzzleSize);
  } catch (e) { settings = { ...DEFAULT_SETTINGS }; }
}
function saveSettings() {
  try { localStorage.setItem("w75_settings", JSON.stringify(settings)); } catch (e) {}
}
function resetSettings() {
  settings = { ...DEFAULT_SETTINGS };
  saveSettings();
  applyTheme(settings.theme);
  applyFontScale(settings.fontScale);
  syncSettingsUI();
  toast("Configuración restablecida");
}

/* ----------------------------------------------------------------
   TEMA
   ---------------------------------------------------------------- */
const THEMES = [
  { id: "cafe",   name: "Café",   bg: "#F4EDE4", accent: "#A66A3C" },
  { id: "rosa",   name: "Rosa",   bg: "#F7EDEE", accent: "#B87A87" },
  { id: "verde",  name: "Verde",  bg: "#EDF2EC", accent: "#5E7F68" },
  { id: "azul",   name: "Azul",   bg: "#EBF0F4", accent: "#587C96" },
  { id: "crema",  name: "Crema",  bg: "#FBF5E9", accent: "#B89355" },
  { id: "oscuro", name: "Oscuro", bg: "#17130F", accent: "#D89B6A" }
];
function applyTheme(id) {
  document.documentElement.setAttribute("data-theme", id);
  const meta = document.querySelector('meta[name="theme-color"]');
  const t = THEMES.find(x => x.id === id);
  if (meta && t) meta.setAttribute("content", t.bg);
}

/* ----------------------------------------------------------------
   ESCALA TIPOGRÁFICA
   ---------------------------------------------------------------- */
const FONT_SCALES = { small: "small", normal: "normal", large: "large", xl: "xl" };
function applyFontScale(id) {
  const valid = FONT_SCALES[id] ? id : "normal";
  document.documentElement.setAttribute("data-fs", valid);
}

/* ----------------------------------------------------------------
   SONIDO
   ---------------------------------------------------------------- */
let audioCtx = null;
function beep(freq, dur, vol) {
  if (!settings.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    g.gain.value = vol || 0.04;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur + 0.02);
  } catch (e) {}
}

/* ----------------------------------------------------------------
   UTILIDADES
   ---------------------------------------------------------------- */
function setView(html) {
  runCleanups();
  const app = document.getElementById("app");
  app.innerHTML = html;
  app.classList.remove("view-in");
  void app.offsetWidth;
  app.classList.add("view-in");
  window.scrollTo(0, 0);
}
function registerCleanup(fn) { cleanupFns.push(fn); }
function runCleanups() {
  cleanupFns.forEach(fn => { try { fn(); } catch (e) {} });
  cleanupFns = [];
}
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

}

};
const ALL_EXPERIENCES = ["personality", "moment", "game", "barista", "puzzle"];
function selectRandomExperience(exclude) {
  const pool = exclude ? ALL_EXPERIENCES.filter(x => x !== exclude) : ALL_EXPERIENCES;
  return pool[Math.floor(Math.random() * pool.length)];
}
function launchExperience(id) {
  currentExperience = id;
  if (id === "personality") showCoffeePersonality();
  else if (id === "moment") showCoffeeMoment();
  else if (id === "game") showCatchTheCoffee();
  else if (id === "barista") showBaristaChallenge();
  else if (id === "puzzle") showLogoPuzzle();
}

/* ----------------------------------------------------------------
   SPLASH
   ---------------------------------------------------------------- */
function playSplash(id) {
  return new Promise(resolve => {
    const splash = document.getElementById("splash");
    const text = document.getElementById("splash-text");
    splash.classList.add("show");
    text.style.opacity = "1";
    text.className = "splash-text";
    text.textContent = "Preparando tu experiencia 75° W…";
    const swap = (str, isName) => {
      text.style.opacity = "0";
      setTimeout(() => {
        text.textContent = str;
        text.className = "splash-text" + (isName ? " splash-name" : "");
        text.style.opacity = "1";
      }, 170);
    };
    setTimeout(() => swap("Hoy te tocó…", false), 900);
    setTimeout(() => swap(EXPERIENCE_NAMES[id], true), 1600);
    setTimeout(() => {
      splash.classList.remove("show");
      setTimeout(() => { launchExperience(id); resolve(); }, 360);
    }, 2450);
  });
}

/* ================================================================
   HELPERS DE RENDER DE PREGUNTAS
   ================================================================ */
function progressDotsHTML(total, step) {
  let html = "";
  for (let i = 0; i < total; i++) {
    let cls = "";
    if (i < step) cls = "done";
    else if (i === step) cls = "active";
    html += `<span class="dot ${cls}"></span>`;
  }
  return `<div class="q-progress">${html}</div>`;
}
function questionBubbleHTML({ icon, count, question }) {
  return `
    <div class="q-bubble">
      <div class="q-emoji-badge" aria-hidden="true">${icon}</div>
      <p class="q-count">${escapeHtml(count)}</p>
      <h2 class="q-text">${escapeHtml(question)}</h2>
    </div>
  `;
}
function optionsHTML(options) {
  return `
    <div class="options">
      ${options.map((o, i) => `
        <button class="option" data-i="${i}" style="animation-delay:${(i * 0.055).toFixed(2)}s">
          <span class="opt-emoji" aria-hidden="true">${o.emoji || "•"}</span>
          <span class="opt-label">${escapeHtml(o.text)}</span>
        </button>
      `).join("")}
    </div>
  `;
}

/* ================================================================

const PERSONALITY_QUESTIONS = [

function showCoffeePersonality() {
  let step = 0;
  const scores = {};
  function renderQuestion() {
    const q = PERSONALITY_QUESTIONS[step];
    setView(`
      <section class="exp">
        <p class="eyebrow">Experiencia 75° W</p>
        <h1 class="exp-title">¿Qué tipo de cafetero eres?</h1>
        <p class="exp-sub">Cuatro preguntas. Ninguna respuesta es la correcta.</p>
        ${progressDotsHTML(PERSONALITY_QUESTIONS.length, step)}
        <div class="q-block" id="q-block">
          ${questionBubbleHTML({ icon: q.icon, count: `Pregunta ${step + 1} de ${PERSONALITY_QUESTIONS.length}`, question: q.q })}
          ${optionsHTML(q.options)}
        </div>
      </section>
    `);
    document.querySelectorAll(".option").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.i);
        const opt = q.options[idx];
        Object.keys(opt.scores).forEach(k => { scores[k] = (scores[k] || 0) + opt.scores[k]; });
        beep(520, 0.06, 0.025);
        step++;
        if (step < PERSONALITY_QUESTIONS.length) {
          const block = document.getElementById("q-block");
          block.classList.add("q-out");
          setTimeout(renderQuestion, 200);
        } else {
          showPersonalityResult();
        }
      });
    });
  }
  function showPersonalityResult() {
    let best = []; let bestScore = -1;
    Object.keys(PROFILES).forEach(key => {
      const s = scores[key] || 0;
      if (s > bestScore) { bestScore = s; best = [key]; }
      else if (s === bestScore) { best.push(key); }
    });
    const chosen = PROFILES[pick(best)];
    setTimeout(() => {
      setView(`
        <section class="exp">
          <p class="eyebrow">Tu resultado</p>
          <div class="result-card">
            <p class="result-kicker">Perfil 75° W</p>
            <h1 class="result-name">${escapeHtml(chosen.name)}</h1>
            <p class="result-desc">${escapeHtml(chosen.desc)}</p>
            <p class="result-quote">“${escapeHtml(chosen.quote)}”</p>
          </div>
          <div class="end-intro">
            <p class="end-headline">Ahora te toca descubrir nuestro café.</p>

          </div>
          ${endActionsHTML()}
          <p class="end-fine">Entretenimiento puro. Ningún test reemplaza una buena taza.</p>
        </section>
      `);
      wireEndActions();
    }, 260);
  }
  renderQuestion();
}

const GOOD_ITEMS = ["☕", "💧", "🫘"];
const BAD_ITEMS  = ["🥕", "👟", "🍋", "🧂", "⚽", "🍃", "🧦", "🥦", "🧄"];
const BAD_LINES = [
  "Eso definitivamente no va en el café.",
  "Bueno… interesante elección.",
  "😂",
  "No, gracias.",
  "El café te lo agradece… creo.",
  "Mmm… no.",
  "Eso se queda por fuera."
];

function showCatchTheCoffee() {
  setView(`
    <section class="exp">
      <p class="eyebrow">Experiencia 75° W</p>

  `);

function startCatchGame() {
  const stage = document.getElementById("game-stage");
  const canvas = document.getElementById("game-canvas");
  if (!stage || !canvas) return;
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const timeEl  = document.getElementById("time-left");
  const noteEl  = document.getElementById("game-note");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  const speedMult = settings.speed === "lenta" ? 0.72 : settings.speed === "rapida" ? 1.35 : 1;
  const DURATION = 25;
  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  const cup = { x: 0, y: 0, r: 32, targetX: 0 };
  let objects = [], floaters = [];
  let score = 0, elapsed = 0, spawnAcc = 0;
  let last = performance.now(), rafId = 0, finished = false, lastNoteAt = -99;

  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function resize() {
    const r = stage.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    positionCup();
  }
  function positionCup() {
    cup.r = Math.max(24, Math.min(38, W * 0.085));
    cup.y = H - cup.r - 12;
    if (cup.x === 0) cup.x = W / 2;
    cup.x = Math.max(cup.r, Math.min(W - cup.r, cup.x));
    cup.targetX = Math.max(cup.r, Math.min(W - cup.r, cup.targetX || W / 2));
  }
  function onPointer(e) {
    if (e.cancelable) e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const p = (e.touches && e.touches[0]) ? e.touches[0] : e;
    cup.targetX = p.clientX - rect.left;
  }
  function spawn() {
    const isGood = Math.random() < 0.62;
    const emoji = isGood ? pick(GOOD_ITEMS) : pick(BAD_ITEMS);
    const size = Math.max(20, Math.min(36, W * 0.072));
    objects.push({
      x: size + Math.random() * Math.max(1, W - size * 2),
      y: -size,
      vy: (72 + Math.random() * 42) * speedMult * (1 + (elapsed / DURATION) * 0.6),
      size, emoji, good: isGood,
      rot: (Math.random() - 0.5) * 0.5,
      rotSpeed: (Math.random() - 0.5) * 1.4
    });
  }
  function addFloater(x, y, text, colorVar) {
    floaters.push({ x, y, text, color: cssVar(colorVar), life: 1 });
  }
  function update(dt) {
    elapsed += dt;
    timeEl.textContent = String(Math.max(0, Math.ceil(DURATION - elapsed)));
    if (elapsed >= DURATION) { endGame(); return; }
    cup.targetX = Math.max(cup.r, Math.min(W - cup.r, cup.targetX));
    cup.x += (cup.targetX - cup.x) * Math.min(1, dt * 14);
    const interval = Math.max(0.34, 0.85 - elapsed * 0.018) / speedMult;
    spawnAcc += dt;
    if (spawnAcc >= interval) { spawnAcc = 0; spawn(); }
    for (let i = objects.length - 1; i >= 0; i--) {
      const o = objects[i];
      o.y += o.vy * dt;
      o.rot += o.rotSpeed * dt;
      const catchY = cup.y - cup.r * 0.35;
      const dx = Math.abs(o.x - cup.x);
      if (o.y > catchY && o.y < cup.y + cup.r * 0.9 && dx < cup.r + o.size * 0.2) {
        if (o.good) {
          score++; scoreEl.textContent = String(score).padStart(2, "0");
          addFloater(o.x, cup.y - 18, "+1", "--accent");
          beep(680, 0.07, 0.03);
        } else {
          const line = pick(BAD_LINES);
          if (elapsed - lastNoteAt > 2.4) { noteEl.textContent = line; lastNoteAt = elapsed; }
          addFloater(o.x, cup.y - 18, "✕", "--muted");
          beep(170, 0.12, 0.03);
        }
        objects.splice(i, 1); continue;
      }
      if (o.y > H + o.size) objects.splice(i, 1);
    }
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.life -= dt * 1.3; f.y -= dt * 34;
      if (f.life <= 0) floaters.splice(i, 1);
    }
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = cssVar("--border") || "#ddd";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, cup.y + cup.r + 4);
    ctx.lineTo(W, cup.y + cup.r + 4);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const o of objects) {
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(o.rot);
      ctx.font = `${o.size}px ${EMOJI_FONT}`;
      ctx.fillText(o.emoji, 0, 0);
      ctx.restore();
    }
    ctx.font = `${cup.r * 2}px ${EMOJI_FONT}`;
    ctx.fillText("☕", cup.x, cup.y);
    for (const f of floaters) {
      ctx.globalAlpha = Math.max(0, f.life);
      ctx.fillStyle = f.color || cssVar("--accent");
      ctx.font = `700 15px "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }
  function loop(now) {
    if (finished) return;
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    if (finished) return;
    draw();
    rafId = requestAnimationFrame(loop);
  }
  function endGame() {
    finished = true;
    cancelAnimationFrame(rafId);
    canvas.removeEventListener("pointerdown", onPointer);
    canvas.removeEventListener("pointermove", onPointer);
    window.removeEventListener("resize", onResize);
    showGameResults(score);
  }
  function onResize() { resize(); }
  resize();
  cup.x = W / 2; cup.targetX = W / 2;
  positionCup();
  canvas.addEventListener("pointerdown", onPointer, { passive: false });
  canvas.addEventListener("pointermove", onPointer, { passive: false });
  window.addEventListener("resize", onResize);
  registerCleanup(() => {
    finished = true;
    cancelAnimationFrame(rafId);
    window.removeEventListener("resize", onResize);
  });
  rafId = requestAnimationFrame(loop);
}

function showGameResults(score) {
  let headline;
  if (score >= 18)      headline = "Eso estuvo bastante bien.";
  else if (score >= 10) headline = "Buen café.";
  else if (score >= 4)  headline = "Tu taza sobrevivió.";
  else                  headline = "La intención es lo que cuenta.";
  const detail = `Atrapaste ${score} ${score === 1 ? "objeto" : "objetos"} que sí iban en la taza.`;
  setView(`
    <section class="exp">
      <p class="eyebrow">Fin del juego</p>
      <div class="end-intro">
        <h1 class="end-headline">${escapeHtml(headline)}</h1>
        <p class="end-sub">${escapeHtml(detail)}</p>
      </div>
      <div class="end-card">
        <p class="end-card-mark">75° W</p>
        <p class="end-card-title">Ahora falta la parte importante.</p>
        <p class="end-card-line">☕ Prepararlo de verdad. Tu drip 75° W te está esperando.</p>
      </div>
      ${endActionsHTML()}
      <p class="end-fine">Nadie gana, nadie pierde. Solo se juega un rato.</p>
    </section>
  `);
  wireEndActions();
}
