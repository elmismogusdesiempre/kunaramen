const BARISTA_DRINKS = {
  ristretto:   { name: "Ristretto",   cup: "☕", recipe: { cafe: 3, agua: 1, leche: 0, espuma: 0 } },
  espresso:    { name: "Espresso",    cup: "☕", recipe: { cafe: 3, agua: 2, leche: 0, espuma: 0 } },
  americano:   { name: "Americano",   cup: "☕", recipe: { cafe: 3, agua: 3, leche: 0, espuma: 0 } },
  cappuccino:  { name: "Cappuccino",  cup: "☕", recipe: { cafe: 3, agua: 0, leche: 1, espuma: 2 } },
  latte:       { name: "Latte",       cup: "☕", recipe: { cafe: 3, agua: 0, leche: 2, espuma: 1 } },
  flatwhite:   { name: "Flat White",  cup: "☕", recipe: { cafe: 3, agua: 0, leche: 2, espuma: 2 } }
};

const BARISTA_INGREDIENTS = {
  cafe:   { emoji: "🫘", label: "Café" },
  agua:   { emoji: "💧", label: "Agua" },
  leche:  { emoji: "🥛", label: "Leche" },
  espuma: { emoji: "☁️", label: "Espuma" }
};

const BARISTA_ORDER_KEYS = ["ristretto", "espresso", "americano", "cappuccino", "latte", "flatwhite"];
const BARISTA_ING_KEYS = ["cafe", "agua", "leche", "espuma"];

function showBaristaChallenge() {
  const speedMult = settings.speed === "lenta" ? 0.85
                  : settings.speed === "rapida" ? 1.25
                  : 1;
  const DURATION = 60 / speedMult;

  let timeLeft = DURATION;
  let ordersDone = 0;
  let currentOrderKey = null;
  let currentRecipe = null;
  let currentCup = { cafe: 0, agua: 0, leche: 0, espuma: 0 };
  let preloaded = { cafe: 0, agua: 0, leche: 0, espuma: 0 };
  let targetMissingKey = null;

  let locked = false;
  let finished = false;
  let timerId = null;

  function randomOrderKey(exclude) {
    const pool = BARISTA_ORDER_KEYS.filter(k => k !== exclude);
    return pick(pool);
  }
  function chooseMissingKey(recipe) {
    const needed = BARISTA_ING_KEYS.filter(k => recipe[k] > 0);
    if (needed.length === 0) return null;
    if (needed.length === 1) return needed[0];
    const nonCafe = needed.filter(k => k !== "cafe");
    const pool = nonCafe.length > 0 ? nonCafe : needed;
    return pick(pool);
  }
  function computeHelpSetup(recipe) {
    const missing = chooseMissingKey(recipe);
    const pre = { cafe: 0, agua: 0, leche: 0, espuma: 0 };
    for (const k of BARISTA_ING_KEYS) {
      pre[k] = (k === missing) ? 0 : recipe[k];
    }
    return { preloaded: pre, missing };
  }
  function applyHelpToCurrentOrder() {
    if (settings.baristaHelp) {
      const setup = computeHelpSetup(currentRecipe);
      preloaded = setup.preloaded;
      targetMissingKey = setup.missing;
    } else {
      preloaded = { cafe: 0, agua: 0, leche: 0, espuma: 0 };
      targetMissingKey = null;
    }
    currentCup = { ...preloaded };
  }
  function newOrder() {
    currentOrderKey = randomOrderKey(currentOrderKey);
    currentRecipe = BARISTA_DRINKS[currentOrderKey].recipe;
    applyHelpToCurrentOrder();
    renderOrder();
  }
  function renderOrder() {
    const drink = BARISTA_DRINKS[currentOrderKey];
    const orderBubble = document.getElementById("barista-order");
    if (orderBubble) {
      orderBubble.querySelector(".barista-order-name").textContent = `Un ${drink.name}, por favor.`;
      orderBubble.querySelector(".q-emoji-badge").textContent = drink.cup;
    }
    renderCup();
    updateCounter();
    updateHelpRow();
  }
  function updateHelpRow() {
    const row = document.getElementById("barista-help-row");
    const sw = document.getElementById("barista-help-switch");
    if (!row || !sw) return;
    row.classList.toggle("on", !!settings.baristaHelp);
    sw.classList.toggle("on", !!settings.baristaHelp);
    sw.setAttribute("aria-checked", settings.baristaHelp ? "true" : "false");

    const hint = document.getElementById("barista-cup-hint");
    if (hint) {
      if (settings.baristaHelp && targetMissingKey) {
        const ing = BARISTA_INGREDIENTS[targetMissingKey];
        const need = currentRecipe[targetMissingKey] || 0;
        const have = currentCup[targetMissingKey] || 0;
        const remaining = Math.max(0, need - have);
        if (remaining > 0) {
          hint.innerHTML = `Falta <strong>${escapeHtml(ing.label)}</strong> ${ing.emoji} × ${remaining}`;
        } else {
          hint.innerHTML = `Listo. Toca <strong>Servir</strong> ☕`;
        }
      } else if (settings.baristaHelp) {
        hint.textContent = "";
      } else {
        hint.textContent = "";
      }
    }
    document.querySelectorAll(".barista-btn").forEach(btn => {
      const key = btn.dataset.ing;
      const isDimmed = settings.baristaHelp && targetMissingKey && key !== targetMissingKey;
      btn.classList.toggle("dimmed", isDimmed);
      const atMax = currentCup[key] >= (currentRecipe[key] || 0);
      btn.classList.toggle("complete", atMax && !isDimmed);
    });
  }
  function renderCup() {
    const row = document.getElementById("barista-cup-row");
    if (!row) return;
    const items = [];
    for (const key of BARISTA_ING_KEYS) {
      for (let i = 0; i < currentCup[key]; i++) {
        const isBase = i < (preloaded[key] || 0);
        items.push({ emoji: BARISTA_INGREDIENTS[key].emoji, base: isBase });
      }
    }
    if (items.length === 0) {
      row.innerHTML = `<div class="barista-cup-empty" style="width:100%">La taza está vacía.</div>`;
    } else {
      row.innerHTML = items
        .map(it => `<span class="slot${it.base ? " slot-base" : ""}">${it.emoji}</span>`)
        .join("");
    }
  }
  function updateCounter() {
    const c = document.getElementById("barista-orders");
    if (c) c.textContent = String(ordersDone).padStart(2, "0");
  }
  function addIngredient(key) {
    if (locked || finished) return;
    if (settings.baristaHelp && targetMissingKey && key !== targetMissingKey) return;
    const maxForThis = currentRecipe[key] || 0;
    if (currentCup[key] >= maxForThis) {
      const ing = BARISTA_INGREDIENTS[key];
      showBaristaPop("info", `${ing.emoji}`, `Ya hay suficiente ${ing.label.toLowerCase()}.`, "Toca Servir ☕");
      return;
    }
    currentCup[key]++;
    beep(600 + currentCup[key] * 20, 0.05, 0.025);
    renderCup();
    updateHelpRow();
  }
  function checkRecipe() {
    for (const k of BARISTA_ING_KEYS) {
      if ((currentCup[k] || 0) !== (currentRecipe[k] || 0)) return false;
    }
    return true;
  }
  function explainFailure() {
    const missing = [], extra = [];
    for (const k of BARISTA_ING_KEYS) {
      const want = currentRecipe[k] || 0;
      const have = currentCup[k] || 0;
      const label = BARISTA_INGREDIENTS[k].label.toLowerCase();
      if (have < want) missing.push(`${want - have} ${label}`);
      else if (have > want) extra.push(`${have - want} ${label}`);
    }
    let msg = "Ese café tomó un camino interesante.";
    const parts = [];
    if (missing.length) parts.push(`faltó ${missing.join(", ")}`);
    if (extra.length) parts.push(`sobró ${extra.join(", ")}`);
    if (parts.length) msg += ` ${parts.join("; ")}.`;
    return msg;
  }

  function showBaristaPop(kind, ico, title, sub, options) {
    const prev = document.querySelector(".barista-pop");
    if (prev) prev.remove();

    const opts = options || {};
    const pop = document.createElement("div");
    pop.className = "barista-pop";
    const cardCls = kind === "ok" ? "ok"
                  : kind === "bad" ? "bad"
                  : "";

    if (opts.summary) {
      pop.innerHTML = `
        <div class="barista-pop-card summary">
          <span class="barista-pop-ico">${ico}</span>
          <h3 class="barista-pop-title ${cardCls}">${escapeHtml(title)}</h3>
          ${sub ? `<p class="barista-pop-sub">${escapeHtml(sub)}</p>` : ``}
          <div class="barista-pop-stats">
            <div class="barista-pop-stat">
              <span class="barista-pop-stat-value">${String(opts.orders || 0).padStart(2, "0")}</span>
              <span class="barista-pop-stat-label">Pedidos</span>
            </div>
          </div>
          <button class="barista-pop-cta" type="button" id="barista-pop-cta">Continuar</button>
        </div>
      `;
    } else {
      pop.innerHTML = `
        <div class="barista-pop-card">
          <span class="barista-pop-ico">${ico}</span>
          <h3 class="barista-pop-title ${cardCls}">${escapeHtml(title)}</h3>
          ${sub ? `<p class="barista-pop-sub">${escapeHtml(sub)}</p>` : ``}
        </div>
      `;
    }

    document.body.appendChild(pop);
    requestAnimationFrame(() => pop.classList.add("show"));

    if (opts.summary) {
      const cta = pop.querySelector("#barista-pop-cta");
      const close = () => {
        pop.classList.remove("show");
        setTimeout(() => {
          if (pop.parentNode) pop.remove();
          if (typeof opts.onClose === "function") opts.onClose();
        }, 280);
      };
      if (cta) cta.addEventListener("click", () => {
        beep(640, 0.08, 0.03);
        close();
      });
      pop.__closeSummary = close;
    } else {
      setTimeout(() => {
        pop.classList.remove("show");
        setTimeout(() => { if (pop.parentNode) pop.remove(); }, 280);
      }, kind === "info" ? 1200 : 1500);
    }
  }

  function serve() {
    if (locked || finished) return;
    locked = true;

    const ok = checkRecipe();

    if (ok) {
      ordersDone++;
      updateCounter();
      showBaristaPop("ok", "☕", "¡Pedido listo!", "Así se hace.");
      beep(820, 0.1, 0.035);
    } else {
      showBaristaPop("bad", "😂", "Mmm... ese café tomó un camino interesante.", explainFailure());
      beep(220, 0.14, 0.03);
    }

    setTimeout(() => {
      if (finished) return;
      locked = false;
      newOrder();
    }, ok ? 900 : 1400);
  }

  function updateTimerUI() {
    const bar = document.getElementById("barista-timerbar");
    const timeLabel = document.getElementById("barista-time");
    if (bar) {
      const pct = Math.max(0, Math.min(1, timeLeft / DURATION));
      const fill = bar.querySelector("span");
      if (fill) fill.style.width = (pct * 100).toFixed(1) + "%";
      bar.classList.toggle("warn", timeLeft <= 10);
    }
    if (timeLabel) {
      timeLabel.textContent = Math.max(0, Math.ceil(timeLeft)) + "s";
    }
  }
  function tick(dt) {
    if (finished) return;
    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      updateTimerUI();
      finishBarista();
      return;
    }
    updateTimerUI();
  }
  function finishBarista() {
    if (finished) return;
    finished = true;
    clearInterval(timerId);
    const pop = document.querySelector(".barista-pop");
    if (pop && !pop.__closeSummary) pop.remove();

    let summaryTitle;
    if (ordersDone >= 15)      summaryTitle = "Nada mal, barista.";
    else if (ordersDone >= 8)  summaryTitle = "Buen turno.";
    else                       summaryTitle = "Turno terminado.";

    const sub = ordersDone === 0
      ? "No alcanzaste a servir ninguno. La próxima sale."
      : `Preparaste ${ordersDone} ${ordersDone === 1 ? "pedido" : "pedidos"} en un minuto.`;

    showBaristaPop("summary", "☕", summaryTitle, sub, {
      summary: true,
      orders: ordersDone,
      onClose: () => {
        showBaristaResults(ordersDone);
      }
    });
    beep(760, 0.12, 0.035);
  }

  setView(`
    <section class="exp">
      <p class="eyebrow">Experiencia 75° W</p>
      <h1 class="exp-title">Barista por 1 minuto</h1>
      <p class="exp-sub">Toca los ingredientes del pedido. Cuando esté listo, sirve el café.</p>

      <div class="barista-hud">
        <div class="barista-count">Pedidos preparados: <strong id="barista-orders">00</strong></div>
        <div class="barista-time" id="barista-time">${Math.ceil(DURATION)}s</div>
      </div>

      <div class="barista-timerbar" id="barista-timerbar"><span></span></div>

      <div class="barista-help-row" id="barista-help-row">
        <div class="barista-help-text">
          <div class="barista-help-title"><span class="hico">✨</span> Modo ayuda</div>
          <div class="barista-help-sub">Precarga todos los ingredientes menos uno. Solo agregas el que falta.</div>
        </div>
        <button class="switch" id="barista-help-switch" role="switch" aria-checked="false"><span></span></button>
      </div>

      <div class="barista-order-bubble" id="barista-order">
        <div class="q-emoji-badge" aria-hidden="true">☕</div>
        <p class="barista-order-label">Pedido</p>
        <h2 class="barista-order-name">Un Espresso, por favor.</h2>
      </div>

      <div class="barista-cup">
        <p class="barista-cup-label">Tu taza</p>
        <div class="barista-cup-row" id="barista-cup-row">
          <div class="barista-cup-empty" style="width:100%">La taza está vacía.</div>
        </div>
        <p class="barista-cup-hint" id="barista-cup-hint"></p>
      </div>

      <div class="barista-controls">
        <button class="barista-btn" data-ing="cafe"><span class="bico">🫘</span><span>Café</span></button>
        <button class="barista-btn" data-ing="agua"><span class="bico">💧</span><span>Agua</span></button>
        <button class="barista-btn" data-ing="leche"><span class="bico">🥛</span><span>Leche</span></button>
        <button class="barista-btn" data-ing="espuma"><span class="bico">☁️</span><span>Espuma</span></button>
      </div>

      <button class="barista-serve" id="barista-serve">Servir ☕</button>
    </section>
  `);

  document.querySelectorAll(".barista-btn").forEach(btn => {
    btn.addEventListener("click", () => addIngredient(btn.dataset.ing));
  });
  document.getElementById("barista-serve").addEventListener("click", serve);

  document.getElementById("barista-help-switch").addEventListener("click", () => {
    if (locked || finished) return;
    settings.baristaHelp = !settings.baristaHelp;
    saveSettings();
    beep(settings.baristaHelp ? 700 : 420, 0.06, 0.025);
    applyHelpToCurrentOrder();
    renderCup();
    updateHelpRow();
  });

  newOrder();
  updateTimerUI();

  let lastTick = performance.now();
  const TICK_MS = 100;
  timerId = setInterval(() => {
    const now = performance.now();
    const dt = (now - lastTick) / 1000;
    lastTick = now;
    tick(dt);
  }, TICK_MS);

  registerCleanup(() => {
    finished = true;
    clearInterval(timerId);
    const pop = document.querySelector(".barista-pop");
    if (pop) pop.remove();
  });
}

function showBaristaResults(ordersDone) {
  let headline;
  if (ordersDone >= 15)      headline = "Nada mal, barista.";
  else if (ordersDone >= 8)  headline = "Buen turno.";
  else if (ordersDone >= 3)  headline = "Turno terminado.";
  else if (ordersDone >= 1)  headline = "Turno terminado.";
  else                       headline = "Turno terminado.";
  const detail = ordersDone === 0
    ? "No alcanzaste a servir ninguno. La próxima sale."
    : `Preparaste ${ordersDone} ${ordersDone === 1 ? "pedido" : "pedidos"}.`;
  setView(`
    <section class="exp">
      <p class="eyebrow">Turno terminado</p>
      <div class="end-intro">
        <h1 class="end-headline">${escapeHtml(headline)}</h1>
        <p class="end-sub">${escapeHtml(detail)}</p>
      </div>
      <div class="end-card">
        <p class="end-card-mark">75° W</p>
        <p class="end-card-title">Ahora falta la parte importante.</p>
        <p class="end-card-line">☕ Prueba 75° W en casa. Llévate tu drip 75° W.</p>
      </div>
      ${endActionsHTML()}
      <p class="end-fine">Nadie gana, nadie pierde. Solo se juega un rato.</p>
    </section>
  `);
  wireEndActions();
}

/* ================================================================
   EXPERIENCIA 5 — ROMPECABEZAS 15 (ARMA EL LOGO 75° W)
   ================================================================ */

function showLogoPuzzle() {
  /* El tamaño vive como variable mutable para permitir cambiarlo en
     vivo desde el selector de dificultad dentro del propio juego. */
  let SIZE = normalizePuzzleSize(settings.puzzleSize);
  let TOTAL = SIZE * SIZE;
  let EMPTY = TOTAL - 1;

  const speedMult = settings.speed === "lenta" ? 0.85
                  : settings.speed === "rapida" ? 1.25
                  : 1;
  const DURATION = 60 / speedMult;

  // Sincronizar CSS con el tamaño de cuadrícula elegido.
  document.documentElement.style.setProperty("--puzzle-size", String(SIZE));

  let board = [];
  let moves = 0;
  let maxTime = DURATION;
  let timeLeft = DURATION;
  let finished = false;
  let solved = false;
  let locked = false;
  let timerId = null;
  let imgFailed = false;

  function isSolved() {
    for (let i = 0; i < TOTAL; i++) {
      if (board[i] !== i) return false;
    }
    return true;
  }

  function neighborsOf(pos) {
    const r = Math.floor(pos / SIZE);
    const c = pos % SIZE;
    const list = [];
    if (r > 0) list.push(pos - SIZE);
    if (r < SIZE - 1) list.push(pos + SIZE);
    if (c > 0) list.push(pos - 1);
    if (c < SIZE - 1) list.push(pos + 1);
    return list;
  }

  function shuffleBoard() {
    board = [];
    for (let i = 0; i < TOTAL; i++) board[i] = i;
    let emptyPos = EMPTY;
    let lastMove = -1;
    const shuffleMoves = Math.max(180, SIZE * SIZE * 14);
    for (let i = 0; i < shuffleMoves; i++) {
      const neigh = neighborsOf(emptyPos).filter(p => p !== lastMove);
      const target = neigh[Math.floor(Math.random() * neigh.length)];
      board[emptyPos] = board[target];
      board[target] = EMPTY;
      lastMove = emptyPos;
      emptyPos = target;
    }
    if (isSolved()) shuffleBoard();
  }

  function emptyPos() { return board.indexOf(EMPTY); }

  function canMove(pos) {
    const e = emptyPos();
    return neighborsOf(e).includes(pos);
  }

  function moveTile(pos) {
    if (finished || locked) return;
    if (!canMove(pos)) {
      beep(180, 0.06, 0.02);
      return;
    }
    const e = emptyPos();
    const tmp = board[pos];
    board[pos] = board[e];
    board[e] = tmp;
    moves++;
    updateMovesUI();
    beep(520 + (moves % 5) * 20, 0.04, 0.02);
    renderBoard(true, pos, e);

    if (isSolved()) {
      solved = true;
      finishPuzzle();
    }
  }

  function tileInner(pieceIndex) {
    const row = Math.floor(pieceIndex / SIZE);
    const col = pieceIndex % SIZE;
    const left = -(col * 100);
    const top  = -(row * 100);
    return `
      <div class="puzzle-img-wrapper">
        <img src="${PUZZLE_IMAGE_URL}"
             alt=""
             draggable="false"
             style="left:${left}%; top:${top}%;" />
      </div>
    `;
  }

  function renderBoard(animate, movedPos, vacatedPos) {
    const boardEl = document.getElementById("puzzle-board");
    if (!boardEl) return;

    const html = board.map((piece, pos) => {
      const isMoved = animate && (pos === movedPos || pos === vacatedPos);
      if (piece === EMPTY) {
        return `<div class="puzzle-tile empty" data-pos="${pos}"></div>`;
      }
      const movable = canMove(pos) ? " movable" : "";
      const pop = isMoved ? " just-moved" : "";
      const inner = imgFailed
        ? `<div class="puzzle-fallback">${piece + 1}</div>`
        : tileInner(piece);
      return `<div class="puzzle-tile${movable}${pop}" data-pos="${pos}">${inner}</div>`;
    }).join("");

    boardEl.innerHTML = html;
  }

  function updateMovesUI() {
    const el = document.getElementById("puzzle-moves");
    if (el) el.textContent = String(moves).padStart(2, "0");
  }
  function updateTimerUI() {
    const bar = document.getElementById("puzzle-timerbar");
    const timeLabel = document.getElementById("puzzle-time");
    if (bar) {
      const pct = Math.max(0, Math.min(1, timeLeft / maxTime));
      const fill = bar.querySelector("span");
      if (fill) fill.style.width = (pct * 100).toFixed(1) + "%";
      bar.classList.toggle("warn", timeLeft <= 10);
    }
    if (timeLabel) {
      timeLabel.textContent = Math.max(0, Math.ceil(timeLeft)) + "s";
    }
  }
  function updateSizeUI() {
    document.querySelectorAll("#puzzle-size-seg button").forEach(b => {
      b.classList.toggle("selected", Number(b.dataset.size) === SIZE);
    });
  }
  function tick(dt) {
    if (finished) return;
    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      updateTimerUI();
      finishPuzzle();
      return;
    }
    updateTimerUI();
  }

  /* Cambia el tamaño del puzzle en vivo. Reinicia la partida con el
     nuevo grid, dejando tiempo y movimientos frescos. */
  function applyPuzzleSize(newSize) {
    const n = normalizePuzzleSize(newSize);
    if (n === SIZE) return;
    SIZE = n;
    TOTAL = SIZE * SIZE;
    EMPTY = TOTAL - 1;
    settings.puzzleSize = n;
    saveSettings();
    document.documentElement.style.setProperty("--puzzle-size", String(SIZE));

    // Reinicio limpio
    moves = 0;
    timeLeft = DURATION;
    maxTime = DURATION;
    updateMovesUI();
    shuffleBoard();
    renderBoard(false);
    updateTimerUI();
    updateSizeUI();
    beep(660, 0.06, 0.025);
  }

  function addMercy() {
    if (finished) return;
    timeLeft += PUZZLE_MERCY_SECONDS;
    maxTime += PUZZLE_MERCY_SECONDS;
    updateTimerUI();
    beep(700, 0.06, 0.025);
    setTimeout(() => beep(880, 0.06, 0.025), 80);
    const btn = document.getElementById("puzzle-mercy");
    if (btn) {
      btn.classList.remove("bumped");
      void btn.offsetWidth;
      btn.classList.add("bumped");
    }
  }

  function finishPuzzle() {
    if (finished) return;
    finished = true;
    clearInterval(timerId);

    const wasSolved = solved;
    if (wasSolved) {
      document.querySelectorAll(".puzzle-tile:not(.empty)").forEach(t => t.classList.add("solved"));
      beep(880, 0.12, 0.04);
      setTimeout(() => beep(1040, 0.14, 0.04), 140);
    } else {
      beep(240, 0.18, 0.03);
    }

    setTimeout(() => showPuzzleResults(wasSolved, moves, timeLeft, maxTime, SIZE), wasSolved ? 900 : 400);
  }

  function showPuzzleResults(wasSolved, movesCount, remaining, total, gridSize) {
    const usedTime = Math.round(total - remaining);
    const gridLabel = `${gridSize} × ${gridSize}`;
    let headline, sub;
    if (wasSolved) {
      if (movesCount <= 20 && gridSize === 3)      headline = "Resuelto. Y con estilo.";
      else if (movesCount <= 40)                   headline = "Resuelto. Y con estilo.";
      else if (movesCount <= 90)                   headline = "Resuelto. Nada mal.";
      else                                         headline = "Resuelto. Lo importante es que quedó.";
      sub = `Armaste el logo 75° W (${gridLabel}) en ${movesCount} ${movesCount === 1 ? "movimiento" : "movimientos"} y ${usedTime} segundos.`;
    } else {
      headline = "Se acabó el tiempo.";
      sub = `El logo quedó a medio armar. La próxima sale.`;
    }
    setView(`
      <section class="exp">
        <p class="eyebrow">Fin del rompecabezas</p>
        <div class="end-intro">
          <h1 class="end-headline">${escapeHtml(headline)}</h1>
          <p class="end-sub">${escapeHtml(sub)}</p>
        </div>
        <div class="end-card">
          <p class="end-card-mark">75° W</p>
          <p class="end-card-title">Ahora falta la parte importante.</p>
          <p class="end-card-line">☕ Prepararlo de verdad. Tu drip 75° W te está esperando.</p>
        </div>
        ${endActionsHTML()}
        <p class="end-fine">Nadie gana, nadie pierde. Solo se juega un rato.</p>
      </section>
    `);
    wireEndActions();
  }

  setView(`
    <section class="exp">
      <p class="eyebrow">Experiencia 75° W</p>
      <h1 class="exp-title">Arma el logo</h1>
      <p class="exp-sub">Desliza las piezas para reconstruir el logo 75° W. Tienes 1 minuto.</p>

      <div class="puzzle-hud">
        <div class="puzzle-moves">Movimientos: <strong id="puzzle-moves">00</strong></div>
        <div class="puzzle-time" id="puzzle-time">${Math.ceil(DURATION)}s</div>
      </div>

      <div class="puzzle-timerbar" id="puzzle-timerbar"><span></span></div>

      <div class="puzzle-difficulty">
        <span class="puzzle-diff-label">Dificultad</span>
        <div class="seg" id="puzzle-size-seg">
          <button type="button" data-size="3">3 × 3</button>
          <button type="button" data-size="4">4 × 4</button>
        </div>
      </div>

      <div class="puzzle-preview">
        <div class="puzzle-preview-img" id="puzzle-preview-img">
          <img src="${PUZZLE_IMAGE_URL}" alt="Logo 75° W" />
        </div>
        <div class="puzzle-preview-text">
          <strong>Meta</strong><br>Reconstruir el logo 75° W con las piezas deslizantes.
        </div>
      </div>

      <div class="puzzle-board" id="puzzle-board"></div>

      <div class="puzzle-actions">
        <button class="btn btn-ghost btn-sm" id="puzzle-shuffle">Barajar de nuevo</button>
        <button class="btn btn-mercy btn-sm" id="puzzle-mercy">
          <span class="mercy-ico">⏳</span>
          <span>Piedad, más tiempo</span>
        </button>
      </div>
    </section>
  `);

  const testImg = new Image();
  testImg.onload = () => {
    imgFailed = false;
    const boardEl = document.getElementById("puzzle-board");
    if (boardEl) renderBoard(false);
    const prev = document.getElementById("puzzle-preview-img");
    if (prev) prev.innerHTML = `<img src="${PUZZLE_IMAGE_URL}" alt="Logo 75° W" />`;
  };
  testImg.onerror = () => {
    imgFailed = true;
    const boardEl = document.getElementById("puzzle-board");
    if (boardEl) renderBoard(false);
    const prev = document.getElementById("puzzle-preview-img");
    if (prev) {
      prev.innerHTML = `<div style="display:grid;place-items:center;width:100%;height:100%;font-family:var(--font-serif);font-weight:700;color:var(--accent);font-size:13px;letter-spacing:.08em;">75° W</div>`;
    }
  };
  testImg.src = PUZZLE_IMAGE_URL;

  shuffleBoard();
  renderBoard(false);
  updateMovesUI();
  updateTimerUI();
  updateSizeUI();

  const boardEl = document.getElementById("puzzle-board");
  boardEl.addEventListener("click", (e) => {
    const tile = e.target.closest(".puzzle-tile");
    if (!tile) return;
    const pos = Number(tile.dataset.pos);
    moveTile(pos);
  });

  document.querySelectorAll("#puzzle-size-seg button").forEach(btn => {
    btn.addEventListener("click", () => {
      if (finished) return;
      applyPuzzleSize(Number(btn.dataset.size));
    });
  });

  document.getElementById("puzzle-shuffle").addEventListener("click", () => {
    if (finished) return;
    beep(500, 0.06, 0.025);
    moves = 0;
    updateMovesUI();
    shuffleBoard();
    renderBoard(false);
    timeLeft = maxTime;
    updateTimerUI();
  });

  document.getElementById("puzzle-mercy").addEventListener("click", addMercy);

  let lastTick = performance.now();
  const TICK_MS = 100;
  timerId = setInterval(() => {
    const now = performance.now();
    const dt = (now - lastTick) / 1000;
    lastTick = now;
    tick(dt);
  }, TICK_MS);

  registerCleanup(() => {
    finished = true;
    clearInterval(timerId);
  });
}

   PIEZAS COMPARTIDAS DE CIERRE

    <div class="end-actions">

function wireEndActions() {

  const anotherBtn = document.getElementById("another-btn");
  if (igBtn) {
    igBtn.addEventListener("click", () => {
      beep(620, 0.07, 0.03);
      if (INSTAGRAM_URL && INSTAGRAM_URL.indexOf("PEGAR") === -1 && INSTAGRAM_URL.trim() !== "") {
        window.open(INSTAGRAM_URL, "_blank", "noopener,noreferrer");
      } else {
        toast("Configura INSTAGRAM_URL en el código para activar este botón.");
      }
    });
  }
  if (anotherBtn) {
    anotherBtn.addEventListener("click", () => {
      beep(480, 0.06, 0.025);
      const next = selectRandomExperience(currentExperience);
      playSplash(next);
    });
  }
}

/* ================================================================
   PANEL DE CONFIGURACIÓN
   ================================================================ */
function buildSettingsUI() {
  const grid = document.getElementById("theme-grid");
  grid.innerHTML = THEMES.map(t => `
    <div class="theme-cell">
      <button class="theme-swatch" data-theme-id="${t.id}" style="background:${t.bg};" aria-label="${escapeHtml(t.name)}">
        <span style="position:absolute;right:7px;bottom:7px;width:12px;height:12px;border-radius:50%;background:${t.accent};"></span>
      </button>
      <span class="theme-name">${escapeHtml(t.name)}</span>
    </div>
  `).join("");
  grid.querySelectorAll(".theme-swatch").forEach(btn => {
    btn.addEventListener("click", () => {
      settings.theme = btn.dataset.themeId;
      applyTheme(settings.theme);
      saveSettings();
      syncSettingsUI();
      beep(600, 0.05, 0.02);
    });
  });
  document.querySelectorAll("#fs-seg button").forEach(btn => {
    btn.addEventListener("click", () => {
      settings.fontScale = btn.dataset.fs;
      applyFontScale(settings.fontScale);
      saveSettings();
      syncSettingsUI();
      beep(580, 0.05, 0.02);
    });
  });
  document.querySelectorAll("#speed-seg button").forEach(btn => {
    btn.addEventListener("click", () => {
      settings.speed = btn.dataset.speed;
      saveSettings();
      syncSettingsUI();
      beep(520, 0.05, 0.02);
    });
  });
  document.querySelectorAll("#coffee-chips .chip").forEach(btn => {
    btn.addEventListener("click", () => {
      const val = btn.dataset.coffee;
      settings.coffee = (settings.coffee === val) ? "" : val;
      saveSettings();
      syncSettingsUI();
      beep(540, 0.05, 0.02);
    });
  });
  document.getElementById("sound-switch").addEventListener("click", () => {
    settings.sound = !settings.sound;
    saveSettings();
    syncSettingsUI();
    if (settings.sound) beep(700, 0.08, 0.03);
  });
  document.getElementById("reset-settings").addEventListener("click", resetSettings);
}

function syncSettingsUI() {
  document.querySelectorAll("#theme-grid .theme-swatch").forEach(b => {
    b.classList.toggle("selected", b.dataset.themeId === settings.theme);
  });
  document.querySelectorAll("#fs-seg button").forEach(b => {
    b.classList.toggle("selected", b.dataset.fs === settings.fontScale);
  });
  document.querySelectorAll("#speed-seg button").forEach(b => {
    b.classList.toggle("selected", b.dataset.speed === settings.speed);
  });
  document.querySelectorAll("#coffee-chips .chip").forEach(b => {
    b.classList.toggle("selected", b.dataset.coffee === settings.coffee);
  });
  const sw = document.getElementById("sound-switch");
  sw.classList.toggle("on", settings.sound);
  sw.setAttribute("aria-checked", settings.sound ? "true" : "false");
}

function openSettings() {
  syncSettingsUI();
  document.getElementById("settings-sheet").classList.add("open");
}
function closeSettings() {
  document.getElementById("settings-sheet").classList.remove("open");
}

/* ================================================================
   INICIALIZACIÓN
   ================================================================ */
function initApp() {
  loadSettings();
  applyTheme(settings.theme);
  applyFontScale(settings.fontScale);
  initBrand();
  buildSettingsUI();
  syncSettingsUI();
  document.getElementById("settings-btn").addEventListener("click", openSettings);
  document.getElementById("close-settings").addEventListener("click", closeSettings);
  document.getElementById("settings-sheet").addEventListener("click", (e) => {
    if (e.target.id === "settings-sheet") closeSettings();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeSettings();
  });
  const first = selectRandomExperience(null);
  playSplash(first);
}

document.addEventListener("DOMContentLoaded", initApp);
